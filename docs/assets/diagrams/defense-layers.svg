<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900">
  <defs>
<marker id="arrow-6d675c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d675c"/></marker>
<marker id="arrow-2b59d1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b59d1"/></marker>
  </defs>
  <rect x="0" y="0" width="1180" height="900" fill="#f1ece1"/>
<text x="40.0" y="34.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="17" font-weight="600" fill="#1b1a17">Three defences, escalating</text>
<text x="40.0" y="56.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="400" fill="#6d675c" font-style="italic">each is reached only when the layer above it could not help; a packet descends the ladder,</text>
<text x="40.0" y="72.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="400" fill="#6d675c" font-style="italic">it does not choose a rung.</text>
<rect x="40.0" y="110.0" width="1100.0" height="160.0" rx="4" fill="none" stroke="#92876f" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="52.0" y="130.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="600" fill="#1b1a17">1  TWO LINES CARRY THE FEED</text>
<rect x="90.0" y="165.0" width="460.0" height="40.0" rx="3" fill="#f1ece1" stroke="#6d675c" stroke-width="1.4"/>
<text x="320.0" y="189.8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="13.5" font-weight="600" fill="#1b1a17">line A</text>
<rect x="90.0" y="215.0" width="460.0" height="40.0" rx="3" fill="#f1ece1" stroke="#6d675c" stroke-width="1.4"/>
<text x="320.0" y="239.8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="13.5" font-weight="600" fill="#1b1a17">line B</text>
<rect x="620.0" y="165.0" width="460.0" height="90.0" rx="3" fill="#e7e0d2" stroke="#92876f" stroke-width="1.4"/>
<text x="850.0" y="197.8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="13.5" font-weight="600" fill="#1b1a17">arbiter</text>
<text x="850.0" y="214.8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="400" fill="#1b1a17">merges A and B by sequence,</text>
<text x="850.0" y="231.8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="400" fill="#1b1a17">discards the duplicate</text>
<path d="M 550.0 185.0 L 620.0 210.0" fill="none" stroke="#6d675c" stroke-width="1.6" marker-end="url(#arrow-6d675c)"/>
<path d="M 550.0 235.0 L 620.0 210.0" fill="none" stroke="#6d675c" stroke-width="1.6" marker-end="url(#arrow-6d675c)"/>
<text x="1140.0" y="200.0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#6d675c" font-style="italic">costs bandwidth all day</text>
<text x="1140.0" y="216.0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#6d675c" font-style="italic">costs no time at all</text>
<path d="M 590.0 270.0 L 590.0 320.0" fill="none" stroke="#92876f" stroke-width="2" marker-end="url(#arrow-92876f)"/>
<rect x="434.8" y="289.0" width="310.4" height="14" fill="#f1ece1" opacity="0.9"/>
<text x="590.0" y="302.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="11.5" font-style="italic" fill="#92876f">escalates when the layer above cannot help</text>
<rect x="40.0" y="330.0" width="1100.0" height="160.0" rx="4" fill="none" stroke="#92876f" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="52.0" y="350.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="600" fill="#1b1a17">2  ASK FOR IT BACK</text>
<rect x="90.0" y="390.0" width="460.0" height="90.0" rx="3" fill="#e7e0d2" stroke="#92876f" stroke-width="1.4"/>
<text x="320.0" y="422.8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="13.5" font-weight="600" fill="#1b1a17">requester</text>
<text x="320.0" y="439.8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="400" fill="#1b1a17">retransmission request,</text>
<text x="320.0" y="456.8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="400" fill="#1b1a17">chunked and re-asked on timeout</text>
<rect x="620.0" y="390.0" width="460.0" height="90.0" rx="3" fill="#e7e0d2" stroke="#92876f" stroke-width="1.4"/>
<text x="850.0" y="422.8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="13.5" font-weight="600" fill="#1b1a17">retransmit_facility</text>
<text x="850.0" y="439.8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="400" fill="#1b1a17">fills the range, or refuses</text>
<text x="850.0" y="456.8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="400" fill="#1b1a17">once the retention window has passed</text>
<path d="M 550.0 435.0 L 620.0 435.0" fill="none" stroke="#2b59d1" stroke-width="1.6" marker-end="url(#arrow-2b59d1)"/>
<rect x="480.2" y="424.0" width="209.6" height="14" fill="#f1ece1" opacity="0.9"/>
<text x="585.0" y="437.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="11.5" font-style="italic" fill="#2b59d1">request  &lt;-&gt;  fill or refuse</text>
<text x="1140.0" y="420.0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#6d675c" font-style="italic">costs a round trip</text>
<text x="1140.0" y="436.0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#6d675c" font-style="italic">and it expires</text>
<path d="M 590.0 490.0 L 590.0 540.0" fill="none" stroke="#92876f" stroke-width="2" marker-end="url(#arrow-92876f)"/>
<rect x="434.8" y="509.0" width="310.4" height="14" fill="#f1ece1" opacity="0.9"/>
<text x="590.0" y="522.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="11.5" font-style="italic" fill="#92876f">escalates when the layer above cannot help</text>
<rect x="40.0" y="550.0" width="1100.0" height="160.0" rx="4" fill="none" stroke="#92876f" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="52.0" y="570.0" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="14" font-weight="600" fill="#1b1a17">3  REBUILD FROM A SNAPSHOT</text>
<rect x="90.0" y="610.0" width="460.0" height="90.0" rx="3" fill="#e7e0d2" stroke="#92876f" stroke-width="1.4"/>
<text x="320.0" y="642.8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="13.5" font-weight="600" fill="#1b1a17">replay_buffer</text>
<text x="320.0" y="659.8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="400" fill="#1b1a17">a client with no state at all</text>
<text x="320.0" y="676.8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="400" fill="#1b1a17">rebuilds the whole book</text>
<rect x="620.0" y="610.0" width="460.0" height="90.0" rx="3" fill="#e7e0d2" stroke="#92876f" stroke-width="1.4"/>
<text x="850.0" y="642.8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="13.5" font-weight="600" fill="#1b1a17">snapshot_facility</text>
<text x="850.0" y="659.8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="400" fill="#1b1a17">streams every price level,</text>
<text x="850.0" y="676.8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="400" fill="#1b1a17">framed as its own numbered stream</text>
<path d="M 550.0 655.0 L 620.0 655.0" fill="none" stroke="#2b59d1" stroke-width="1.6" marker-end="url(#arrow-2b59d1)"/>
<rect x="480.2" y="644.0" width="209.6" height="14" fill="#f1ece1" opacity="0.9"/>
<text x="585.0" y="657.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="11.5" font-style="italic" fill="#2b59d1">begin  &lt;-&gt;  levels  &lt;-&gt;  end</text>
<text x="1140.0" y="640.0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#6d675c" font-style="italic">costs seconds</text>
<text x="1140.0" y="656.0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12" font-weight="400" fill="#6d675c" font-style="italic">blind while it runs</text>
<rect x="40.0" y="750.0" width="1100.0" height="50.0" rx="3" fill="#f1ece1" stroke="#cfc7b5" stroke-width="1.4"/>
<text x="590.0" y="771.3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="400" fill="#6d675c">The last row is the interesting one: the client's own book is not trusted while a snapshot runs, and</text>
<text x="590.0" y="788.3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="400" fill="#6d675c">unfillable_messages says so rather than publishing a book that looks complete and is permanently wrong.</text>
</svg>
