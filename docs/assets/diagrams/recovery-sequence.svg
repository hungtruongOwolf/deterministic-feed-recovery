<text x="680.0" y="821.3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace" font-size="12.5" font-weight="400" fill="#6d675c">Delivering 4 after 5 in arrival order, instead of between 3 and 5 in sequence order, is the exact</text>
