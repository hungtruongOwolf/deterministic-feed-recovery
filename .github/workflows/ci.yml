# Builds and tests the library the same four ways a change is verified locally.
#
# The matrix is not decoration. Two real defects in this repository were invisible in one configuration
# and fatal in another: a dangling span into a destroyed temporary that -O0 had not yet reused the stack
# for, and a test asserting that a disabled assertion does not evaluate its condition, which the
# assertions-off build reported as an unused declaration. So all four run, and all four are required.
#
# Clang only, and that is a stated limit rather than a preference: the local development machine has no
# real GCC, so a GCC job would be a configuration nobody had verified before committing it. The warning
# set in CMakeLists.txt already branches on the compiler, so adding GCC is a small change — it just has
# not been run.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, release, bench, asan]
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Compiler and CMake versions
        run: |
          clang++ --version
          cmake --version

      # Catch2 is fetched by FetchContent and pinned to a tag, so the cache key needs nothing but the
      # file that pins it.
      - name: Cache the Catch2 build
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ matrix.preset }}-${{ hashFiles('tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j 4

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  traces:
    name: traces reproduce
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        run: |
          cmake --preset dev
          cmake --build --preset dev -j 4

      # The committed traces are fixtures, not samples: each is a deterministic function of its seed. So a
      # non-empty diff here is a behavioural change, and it is worth failing on rather than noticing later.
      - name: Regenerate and compare
        run: |
          ./scripts/regenerate-traces.sh dev
          git diff --exit-code -- traces/ viewer/public/traces/

  # The benchmarks have to keep compiling and the two hard claims have to keep holding. The *figures* are not
  # asserted — they move with the machine and a CI runner is a different machine — but "zero allocations after
  # start-up" and "the ring refuses rather than overwriting" are properties, not measurements, and a runner can
  # check them as well as a laptop.
  bench:
    name: benchmarks build, and the hard claims hold
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Build at the shipping configuration
        run: |
          cmake -S . -B build/o3-off -DCMAKE_BUILD_TYPE=Release -DDFR_ASSERTIONS=off -DDFR_WARNINGS_AS_ERRORS=ON
          cmake --build build/o3-off -j 4 --target dfr_recovery_bench dfr_handoff_bench

      # recovery_bench exits non-zero if anything allocated after initialisation, so this is the assertion.
      - name: Nothing allocates after start-up
        run: ./build/o3-off/bench/recovery_bench --samples 40

      - name: The hand-off runs and the ring refuses rather than overwriting
        run: ./build/o3-off/bench/handoff_bench --messages 400000

  # The load-bearing check for the WebAssembly build: does the browser produce the same trace as the
  # terminal? Two compilers, two targets, one seed. If the bytes ever differ then something in the library
  # depends on its platform, and "deterministic" was a word rather than a property — so this fails the build
  # rather than being noticed later by a reader comparing numbers.
  wasm:
    name: wasm matches native, byte for byte
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the native tools
        run: |
          cmake --preset dev
          cmake --build --preset dev -j 4 --target dfr_trace dfr_session

      # The committed module is an artifact, committed on purpose so Pages can deploy without an Emscripten
      # toolchain. Staleness is checked by *behaviour*, not by bytes: a WebAssembly binary is not
      # reproducible across emsdk versions or hosts, so a byte diff would fail for reasons nobody caused.
      # What matters is that the module the page will actually load still agrees with the native build — so
      # if somebody changes the library and forgets to rebuild, this is the step that says so.
      - name: The committed module still agrees with native
        run: ./scripts/check-wasm.sh dev

      - name: Build for the browser
        run: ./scripts/build-wasm.sh

      # And the module built from this commit agrees too, which is the check for the source rather than the
      # artifact. Both are needed: the first can pass on a stale-but-correct artifact after a purely internal
      # refactor, and the second cannot tell whether the committed file was rebuilt.
      - name: The freshly built module agrees with native
        run: ./scripts/check-wasm.sh dev

  viewer:
    name: viewer typechecks and builds
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      # `npm ci` rather than `npm install`, because the lock file is committed on purpose: a project whose
      # central claim is that a run reproduces from a seed cannot leave its own dependency versions to
      # chance.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # Renders the scene in node and checks the three ways it could be silently broken: it draws at all,
      # consecutive frames of one beat differ so the picture actually moves, and every caption is a sentence
      # rather than a field name. Nothing without eyes can tell whether it looks good; this tells whether it
      # works.
      - run: npm run check
